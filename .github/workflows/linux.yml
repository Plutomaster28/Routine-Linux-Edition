name: Linux

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config gfortran \
            libcurl4-openssl-dev libssl-dev libwebsockets-dev \
            nlohmann-json3-dev libyaml-cpp-dev lua5.4 liblua5.4-dev

      - name: Build and test
        run: ./build_linux.sh

      - name: Audit public files
        run: ./release_audit.sh
